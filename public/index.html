<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Mobile Clock</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#eeeef2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#202023" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-title" content="Mobile Clock">
  <script>
    // Set the theme before the stylesheet paints, so the page never flashes the wrong one. Light by default.
    try { var t = localStorage.getItem('theme'); document.documentElement.dataset.theme = /^(light|dark|system)$/.test(t) ? t : 'light'; }
    catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Mobile Clock">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">◷</span>
        <h1>Mobile Clock</h1>
      </div>
      <button type="button" class="search-btn" id="palette-btn" aria-keyshortcuts="Meta+K Control+K">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14ZM20 20l-4-4"/></svg>
        <span>Search or jump to…</span><kbd>⌘K</kbd>
      </button>
      <nav id="nav" aria-label="Views"></nav>
      <section class="side-section" aria-labelledby="status-title">
        <div class="side-title" id="status-title">Status</div>
        <div id="status-strip" class="status-strip"></div>
      </section>
    </aside>
    <main id="main">
      <div class="banner info" id="jira-banner" role="status" hidden></div>
      <div id="views"></div>
    </main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Views"></nav>

  <script type="module" src="app.js"></script>
</body>
</html>
